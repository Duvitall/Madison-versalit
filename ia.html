<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Madison iA</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #7a4006e3, #1a0d01e3);
      color: #d8a808;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
  
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: min(520px, 100%);
      position: relative;
      transform: translateY(24px);
    }

    .wrapper::before {
      content: "";
      position: absolute;
      inset: -70px -90px -55px;
      border-radius: 34px;
      background: radial-gradient(circle at top, rgba(255, 183, 72, 0.18), transparent 42%),
                  radial-gradient(circle at center, rgba(218, 71, 3, 0.16), transparent 68%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 0;
    }

    .logo {
      width: min(215px, 44%);
      height: auto;
      filter: drop-shadow(0 0 15px rgba(218, 71, 3, 0.6));
      margin-bottom: 0;
      position: absolute;
      bottom: calc(100% - 62px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }
   
    #chat {
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid rgba(235, 133, 0, 0.329);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(170, 68, 0, 0.658), 0 0 50px rgba(218, 71, 3, 0.4);
      padding: 16px;
    }

    #chat::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 14px;
      background:
        linear-gradient(#d8a808, #d8a808) left top / 42px 2px no-repeat,
        linear-gradient(#d8a808, #d8a808) left top / 2px 42px no-repeat,
        linear-gradient(#d8a808, #d8a808) right top / 42px 2px no-repeat,
        linear-gradient(#d8a808, #d8a808) right top / 2px 42px no-repeat,
        linear-gradient(#d8a808, #d8a808) left bottom / 42px 2px no-repeat,
        linear-gradient(#d8a808, #d8a808) left bottom / 2px 42px no-repeat,
        linear-gradient(#d8a808, #d8a808) right bottom / 42px 2px no-repeat,
        linear-gradient(#d8a808, #d8a808) right bottom / 2px 42px no-repeat;
      opacity: 0.5;
      pointer-events: none;
      z-index: 2;
    }

    #messages {
      height: 220px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.05);
    }

    #chat > div:last-child {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .msg {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 75%;
      animation: fadeIn 0.4s ease;
    }

    .user {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      margin-left: auto;
      box-shadow: 0 0 10px #22c55e;
    }

    .bot {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      margin-right: auto;
      box-shadow: 0 0 10px #3b82f6;
    }

    #input {
      width: auto;
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
    }

    button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin-left: 0;
      color: white;
      transition: transform 0.2s;
      flex-shrink: 0;
      width: 84px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      line-height: 1;
    }

    #send {
      background: linear-gradient(135deg, #471d01b6, #852c02dc);
      box-shadow: 0 0 12px rgba(153, 62, 2, 0.8);
    }

    #mic {
      background: linear-gradient(135deg, #7a4006e3, #7a4006e3);
      box-shadow: 0 0 15px #7a4006e3;
    }

    button:hover { transform: scale(1.05); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <img src="imagens/logo sem fundo.png" class="logo" alt="Madison iA">
    <div id="chat">
      <div id="messages"></div>
      <div>
        <input id="input" placeholder="Diga a madison..." />
        <button id="send">Enviar</button>
        <button id="mic">🎤 Falar</button>
      </div>
    </div>
     <a href="index.html" class="Voltar">Voltar</a>
     <style> 
        .Voltar {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #7a4006e3;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        .Voltar:hover {
            background-color: #5c2e05e3;
        }
      </style>
  </div>
</body>
</html>
