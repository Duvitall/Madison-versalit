<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Madison iA</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #7a4006e3, #1a0d01e3);
      color: #d8a808;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
  
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: min(520px, 100%);
      position: relative;
      transform: translateY(24px);
    }

    .wrapper::before {
      content: "";
      position: absolute;
      inset: -70px -90px -55px;
      border-radius: 34px;
      background: radial-gradient(circle at top, rgba(255, 183, 72, 0.18), transparent 42%),
                  radial-gradient(circle at center, rgba(218, 71, 3, 0.16), transparent 68%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 0;
    }

    .logo {
      width: min(215px, 44%);
      height: auto;
      filter: drop-shadow(0 0 15px rgba(218, 71, 3, 0.6));
      margin-bottom: 0;
      position: absolute;
      bottom: calc(100% - 62px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }
   
    #chat {
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid rgba(235, 133, 0, 0.329);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(170, 68, 0, 0.658), 0 0 50px rgba(218, 71, 3, 0.4);
      padding: 16px;
    }

    #chat::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 14px;
      background:
        linear-gradient(#d8a808, #d8a808) left top / 42px 2px no-repeat,
        linear-gradient(#d8a808, #d8a808) left top / 2px 42px no-repeat,
        linear-gradient(#d8a808, #d8a808) right top / 42px 2px no-repeat,
        linear-gradient(#d8a808, #d8a808) right top / 2px 42px no-repeat,
        linear-gradient(#d8a808, #d8a808) left bottom / 42px 2px no-repeat,
        linear-gradient(#d8a808, #d8a808) left bottom / 2px 42px no-repeat,
        linear-gradient(#d8a808, #d8a808) right bottom / 42px 2px no-repeat,
        linear-gradient(#d8a808, #d8a808) right bottom / 2px 42px no-repeat;
      opacity: 0.5;
      pointer-events: none;
      z-index: 2;
    }

    #messages {
      height: 220px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.05);
      scrollbar-width: thin;
      scrollbar-color: #7a4006e3 transparent;
    }

    #messages::-webkit-scrollbar {
      width: 8px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #7a4006e3;
      border-radius: 4px;
    }

    #messages::-webkit-scrollbar-thumb:hover {
      background: #5c2e05e3;
    }

    #messages::-webkit-scrollbar-button {
      display: none;
    }

    #chat > div:last-child {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .msg {
      margin: 8px 0;
      padding: 8px 10px;
      border-radius: 12px;
      max-width: 60%;
      font-size: 14px;
      animation: fadeIn 0.4s ease;
    }

    .user {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      margin-left: auto;
      box-shadow: 0 0 10px #22c55e;
    }

    .bot {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      margin-right: auto;
      box-shadow: 0 0 10px #3b82f6;
    }

    #input {
      width: auto;
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
    }

    button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin-left: 0;
      color: white;
      transition: transform 0.2s;
      flex-shrink: 0;
      width: 84px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      line-height: 1;
    }

    #send {
      background: linear-gradient(135deg, #471d01b6, #852c02dc);
      box-shadow: 0 0 12px rgba(153, 62, 2, 0.8);
    }

    #mic {
      background: linear-gradient(135deg, #7a4006e3, #7a4006e3);
      box-shadow: 0 0 15px #7a4006e3;
    }

    button:hover { transform: scale(1.05); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div style="position:fixed; top:20px; left:20px; z-index:50;">
    <button id="topLeftSettingsBtn" style="padding:10px; border-radius:12px; border:none; background:rgba(170,68,0,0.8); color:#fff; cursor:pointer; backdrop-filter:blur(10px);">⚙️</button>
  </div>

  <div class="wrapper">
    <img src="imagens/logo sem fundo.png" class="logo" alt="Madison iA">
    <div id="chat">
      <div id="messages"></div>
      <div>
        <input id="input" placeholder="Diga a madison..." />
        <button id="send">Enviar</button>
        <button id="mic">🎤 Falar</button>
      </div>
    </div>
     <a href="index.html" class="Voltar">Voltar</a>
     <style> 
        .Voltar {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #7a4006e3;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        .Voltar:hover {
            background-color: #5c2e05e3;
        }
      </style>
  </div>

  <!-- Modal de configurações -->
  <div id="settingsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center; visibility: hidden;">
    <div style="background:rgba(17,24,39,0.9); padding:24px; border-radius:16px; width:90%; max-width:400px; color:#e2e8f0;">
      <h3 style="margin-top:0; margin-bottom:16px;">Configurar API Key</h3>
      <input type="password" id="apiKeyInput" style="width:100%; padding:12px; margin-bottom:16px; border-radius:8px; border:none; background:#1e293b; color:#e2e8f0;" placeholder="Digite sua chave API Groq">
      <div style="display:flex; gap:8px;">
        <button id="saveKey" style="flex:1; padding:12px; border-radius:8px; border:none; background:#10b981; color:#fff; cursor:pointer;">Salvar</button>
        <button id="closeModal" style="padding:12px; border-radius:8px; border:none; background:#64748b; color:#fff; cursor:pointer;">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // Carregar API key do localStorage ou usar placeholder
    const storedKey = localStorage.getItem('groqApiKey');
    let GROQ_API_KEY = storedKey || '';
    document.getElementById('apiKeyInput').value = storedKey || '';
    // Modelos atuais da Groq (llama-3.3-70b-versatile foi descontinuado em 16/08/2026)
    const GROQ_MODELS = ['openai/gpt-oss-120b', 'qwen/qwen3.6-27b'];

    // Treinamento da Madison: catálogo e regras de atendimento
    const SYSTEM_PROMPT = `Você é Madison, assistente virtual da loja de roupas "Madison Versalit".
Sua ÚNICA função é ajudar o cliente a conhecer e comprar os produtos da loja.

REGRAS OBRIGATÓRIAS:
1. Responda sempre de forma CLARA, DIRETA e RESUMIDA (no máximo 2 a 3 frases).
2. Fale SOMENTE sobre os produtos da loja, preços, compras e carrinho.
3. Se o cliente fugir do assunto, responda educadamente que você só atende sobre os produtos da loja e ofereça ajuda com o catálogo.
4. Use os nomes e preços exatos do catálogo abaixo.
5. Para comprar, oriente o cliente a clicar no botão "Comprar" do produto (precisa estar logado) para adicionar ao carrinho.

CATÁLOGO (produto — preço):
FEMININO:
1. Vestido curto azul, tecido leve e acinturado — R$ 79,90
2. Vestido longo verde, tecido leve e acinturado com fenda — R$ 129,90
3. Vestido longo branco, acinturado com decote nas costas — R$ 39,90
4. Vestido longo amarelo, tecido leve com manga curta — R$ 108,99
MASCULINO:
5. Conjunto masculino, blusa branca e calça bege — R$ 89,90
6. Kit masculino, blusa branca, calça verde e bolsa — R$ 119,90
7. Conjunto masculino inverno, moletom branco e calça cinza — R$ 139,90
8. Conjunto streetwear, blusa marrom e short bege — R$ 99,90
INFANTIL:
9. Conjunto bege kids, calça jeans e cropped moletom — R$ 59,90
10. Conjunto bege kids, short bege e blusa de gola — R$ 49,90
11. Conjunto verde kids, calça jeans verde e blusa quadriculada — R$ 69,90
12. Vestido verde kids com bolsa marrom — R$ 54,90`;

    // Elementos DOM
    const messagesDiv = document.getElementById('messages');
    const inputField = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const micBtn = document.getElementById('mic');

    // Estado da aplicação
    let isSpeaking = false;
    let speechEnabled = true;

    // Adicionar mensagem ao chat
    function addMessage(text, sender, speak = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.textContent = text;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      
      if (sender === 'bot' && speechEnabled && speak) {
        speakText(text);
      }
    }

    // Lista de vozes disponíveis no navegador
    let vozesNavegador = [];

    function carregarVozes() {
      vozesNavegador = window.speechSynthesis.getVoices();
    }

    carregarVozes();
    window.speechSynthesis.onvoiceschanged = carregarVozes;

    // Seleciona a melhor voz feminina (prioriza português)
    function getFemaleVoice() {
      vozesNavegador = window.speechSynthesis.getVoices();

      // 1) Voz em português com nome feminino (ex: Maria, Francisca, Luciana)
      let voz = vozesNavegador.find(v =>
        v.lang.toLowerCase().startsWith('pt') &&
        /maria|francisca|luciana|feminin|female|helena|vitoria|juliana/.test(v.name.toLowerCase())
      );

      // 2) Qualquer voz em português
      if (!voz) {
        voz = vozesNavegador.find(v => v.lang.toLowerCase().startsWith('pt'));
      }

      // 3) Qualquer voz que pareça feminina (ex: Zira, Google female, etc.)
      if (!voz) {
        voz = vozesNavegador.find(v =>
          /female|feminin|zira|maria|susan|hazel/.test(v.name.toLowerCase())
        );
      }

      if (voz) {
        console.log('Voz escolhida:', voz.name, voz.lang);
      } else {
        console.warn('Nenhuma voz feminina encontrada. Vozes disponíveis:', vozesNavegador.map(v => `${v.name} (${v.lang})`));
      }

      return voz || null;
    }

    // Função de síntese de voz (voz feminina do navegador)
    function speakText(text) {
      if (!speechEnabled) return;

      const falar = () => {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1;
        utterance.pitch = 1.1;

        const voz = getFemaleVoice();
        if (voz) {
          utterance.voice = voz;
          utterance.lang = voz.lang;
        }

        utterance.onstart = () => {
          isSpeaking = true;
          micBtn.textContent = '🔊 Falando';
        };

        utterance.onend = () => {
          isSpeaking = false;
          micBtn.textContent = '🎤 Falar';
        };

        utterance.onerror = () => {
          isSpeaking = false;
          micBtn.textContent = '🎤 Falar';
        };

        window.speechSynthesis.speak(utterance);
      };

      // Se as vozes ainda não carregaram, aguarda até carregar (máx ~2s)
      if (window.speechSynthesis.getVoices().length > 0) {
        falar();
      } else {
        let tentativas = 0;
        const intervalo = setInterval(() => {
          tentativas++;
          if (window.speechSynthesis.getVoices().length > 0 || tentativas > 10) {
            clearInterval(intervalo);
            falar();
          }
        }, 200);
      }
    }

    // Alternar mute/unmute da voz
    function toggleSpeech() {
      speechEnabled = !speechEnabled;

      if (!speechEnabled) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        micBtn.textContent = '🔇 Mutado';
        micBtn.style.background = 'linear-gradient(135deg, #6b7280, #4b5563)';
      } else {
        micBtn.textContent = '🎤 Falar';
        micBtn.style.background = 'linear-gradient(135deg, #7a4006e3, #7a4006e3)';
      }
    }

    // Fazer uma chamada à API Groq com um modelo específico
    async function callGroq(model, message) {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${GROQ_API_KEY}`
        },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: message }
          ],
          temperature: 0.5,
          max_tokens: 500
        })
      });

      if (!response.ok) {
        let detail = '';
        try {
          detail = (await response.json())?.error?.message || '';
        } catch (e) {}
        throw { status: response.status, detail: detail };
      }

      const data = await response.json();
      return data.choices[0].message.content;
    }

    // Enviar mensagem para o Groq (com mensagens de erro claras)
    async function sendMessageToGroq(message) {
      if (!GROQ_API_KEY) {
        return 'Para eu responder, primeiro configure sua API key: clique no botão ⚙️ no canto superior esquerdo.';
      }

      for (const model of GROQ_MODELS) {
        try {
          return await callGroq(model, message);
        } catch (error) {
          const status = error.status;

          // Chave inválida/expirada — não adianta tentar outro modelo
          if (status === 401 || status === 403) {
            return 'Sua API key é inválida ou expirou. Clique no ⚙️ e salve a chave correta do console da Groq.';
          }
          // Limite de requisições
          if (status === 429) {
            return 'Limite de requisições da Groq atingido. Aguarde alguns segundos e tente novamente.';
          }
          // Modelo não encontrado — tenta o próximo da lista
          if (status === 404 || (error.detail && /model/i.test(error.detail))) {
            console.warn('Modelo indisponível:', model, error);
            continue;
          }
          // Erro de rede/CORS
          if (!status) {
            console.error('Erro de rede ao chamar Groq:', error);
            return 'Não consegui conectar à API. Verifique sua internet ou abra a página através do servidor (http://localhost) em vez do arquivo direto.';
          }
          console.error('Erro ao chamar Groq:', status, error.detail);
          return `Ocorreu um erro na API (${status}): ${error.detail || 'erro desconhecido'}`;
        }
      }

      return 'Nenhum modelo disponível respondeu. Tente novamente em instantes.';
    }

    // Testar se uma chave de API é válida (usada ao salvar configurações)
    async function testGroqKey(key) {
      try {
        const response = await fetch('https://api.groq.com/openai/v1/models', {
          headers: { 'Authorization': `Bearer ${key}` }
        });
        if (response.ok) return { valid: true };
        let detail = '';
        try { detail = (await response.json())?.error?.message || ''; } catch (e) {}
        return { valid: false, status: response.status, detail: detail };
      } catch (error) {
        console.error('Erro ao testar chave Groq:', error);
        return { valid: false, network: true };
      }
    }

    // Manipular envio de mensagem
    async function handleSend() {
      const userMessage = inputField.value.trim();
      if (!userMessage) return;

      // Adicionar mensagem do usuário
      addMessage(userMessage, 'user');
      inputField.value = '';

      // Mostrar indicador de carregamento
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'msg bot';
      loadingDiv.textContent = 'Madison está pensando...';
      messagesDiv.appendChild(loadingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      // Obter resposta do Groq
      const botResponse = await sendMessageToGroq(userMessage);

      // Remover indicador de carregamento
      messagesDiv.removeChild(loadingDiv);

      // Adicionar resposta do bot
      addMessage(botResponse, 'bot');
    }

    // Event Listeners
    sendBtn.addEventListener('click', handleSend);
    
    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleSend();
      }
    });

micBtn.addEventListener('click', toggleSpeech);

    // Modal de configurações
    const settingsModal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKey');
    const closeModalBtn = document.getElementById('closeModal');

    // Botão de configurações no canto esquerdo superior
    const topLeftSettingsBtn = document.getElementById('topLeftSettingsBtn');
    topLeftSettingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'flex';
      settingsModal.style.visibility = 'visible';
      if (apiKeyInput.value) {
        apiKeyInput.select();
      }
    });

    closeModalBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    saveKeyBtn.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        addMessage('Por favor, digite uma chave API válida.', 'bot');
        return;
      }

      saveKeyBtn.disabled = true;
      saveKeyBtn.textContent = 'Verificando...';

      const result = await testGroqKey(key);

      if (result.valid) {
        localStorage.setItem('groqApiKey', key);
        GROQ_API_KEY = key;
        settingsModal.style.display = 'none';
        addMessage('API key válida! Chave salva — a Madison já pode responder. 🎉', 'bot');
      } else if (result.network) {
        addMessage('Não consegui verificar a chave (sem conexão com a Groq). Confira sua internet e tente novamente.', 'bot');
      } else if (result.status === 401) {
        addMessage(`Chave inválida (401): ${result.detail || 'API key incorreta'}. Verifique se copiou a chave certa do console da Groq.`, 'bot');
      } else {
        addMessage(`Não foi possível validar a chave (${result.status}): ${result.detail || 'erro desconhecido'}`, 'bot');
      }

      saveKeyBtn.disabled = false;
      saveKeyBtn.textContent = 'Salvar';
    });

    // Fechar modal ao clicar fora
    window.addEventListener('click', (e) => {
      if (e.target === settingsModal) {
        settingsModal.style.display = 'none';
      }
    });

    // Mensagem de boas-vindas
    addMessage('Olá! Eu sou a Madison, assistente da Madison Versalit. Posso ajudar você com nossas roupas femininas, masculinas e infantis. Como posso ajudar?', 'bot');

    // Se não houver chave salva, avisa como configurar
    if (!GROQ_API_KEY) {
      addMessage('⚠️ Para eu poder responder, configure sua API key da Groq: clique no botão ⚙️ no canto superior esquerdo.', 'bot', false);
    } else {
      // Valida a chave salva em segundo plano e avisa se estiver inválida
      testGroqKey(GROQ_API_KEY).then((result) => {
        if (!result.valid && result.status === 401) {
          addMessage('⚠️ A API key salva parece inválida ou expirada. Clique no ⚙️ para atualizar a chave.', 'bot', false);
        }
      });
    }
  </script>
</body>
</html>
